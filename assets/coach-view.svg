<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Concept illustration: side view of a rescuer kneeling beside a patient lying on their back, with stacked hands on the centre of the chest and straight vertical arms. Pose landmarks mark the shoulder, elbow and wrist, next to a live feedback panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#160b1a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.18"/>
    </linearGradient>
    <style>
      /* one compression every 0.545s = 110/min */
      .press { animation: press 0.545s ease-in-out infinite; }
      @keyframes press { 0%,100% { transform: translateY(0); } 45% { transform: translateY(5px); } }
      .scan { animation: scan 2.6s ease-in-out infinite alternate; }
      @keyframes scan { from { transform: translateY(0); } to { transform: translateY(330px); } }
      .bar { animation: bar 1.09s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
      @keyframes bar { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.82); } }
      .rec { animation: rec 1s steps(2, start) infinite; }
      @keyframes rec { to { visibility: hidden; } }
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, Menlo, monospace; }
    </style>
    <clipPath id="cam"><rect x="24" y="24" width="500" height="392" rx="18"/></clipPath>
  </defs>

  <rect width="900" height="440" rx="24" fill="url(#bg)"/>

  <!-- ===== Camera view ===== -->
  <rect x="24" y="24" width="500" height="392" rx="18" fill="#0e1628" stroke="#24324d"/>
  <g clip-path="url(#cam)">
    <!-- floor, seen from a slightly raised phone: the rescuer is on the far side of the patient -->
    <rect x="24" y="306" width="500" height="110" fill="#131d33"/>
    <line x1="24" y1="306" x2="524" y2="306" stroke="#24324d" stroke-width="2"/>

    <!-- rescuer's legs, kneeling beside the patient's chest and shoulder, behind the patient -->
    <g fill="none" stroke-linecap="round">
      <path d="M440 262 L424 330 L478 326" stroke="#2a3a58" stroke-width="20" stroke-linejoin="round"/>
      <path d="M440 262 L424 330 L478 326" stroke="#5eead4" stroke-width="4" stroke-linejoin="round" opacity="0.9"/>
    </g>

    <!-- patient, flat on their back: head on the right, feet on the left -->
    <g fill="#3a465e">
      <path d="M66 346 C66 334 80 332 86 342 L100 354 L230 352 Q290 348 330 345 L424 344 Q444 344 446 362 Q446 380 424 380 L84 380 Q66 380 66 362 Z"/>
      <rect x="440" y="354" width="18" height="18" rx="4"/>
      <circle cx="474" cy="358" r="22" fill="#4a5874"/>
    </g>

    <!-- where the hands go: centre of the chest, in line with the armpits -->
    <ellipse cx="392" cy="352" rx="30" ry="7" fill="none" stroke="#5eead4" stroke-width="2"/>

    <!-- rescuer's upper body: moves with each compression -->
    <g class="press">
      <g fill="none" stroke="#2a3a58" stroke-linecap="round">
        <line x1="440" y1="262" x2="392" y2="176" stroke-width="30"/>
        <line x1="392" y1="176" x2="392" y2="314" stroke-width="16"/>
      </g>
      <circle cx="375" cy="130" r="22" fill="#2a3a58"/>
      <rect x="374" y="320" width="36" height="11" rx="5.5" fill="#7c8da8"/>
      <rect x="374" y="331" width="36" height="11" rx="5.5" fill="#a3b1c6"/>
      <g stroke="#5eead4" stroke-width="4" stroke-linecap="round" fill="none">
        <line x1="440" y1="262" x2="392" y2="176"/>   <!-- torso -->
        <line x1="392" y1="176" x2="396" y2="244"/>   <!-- upper arm -->
        <line x1="396" y1="244" x2="392" y2="312"/>   <!-- forearm -->
        <line x1="392" y1="176" x2="382" y2="150"/>   <!-- neck -->
      </g>
      <circle cx="375" cy="130" r="22" fill="none" stroke="#5eead4" stroke-width="3" opacity="0.8"/>
      <!-- elbow angle arc, on the inside of the arm -->
      <path d="M394.7 222 A22 22 0 0 0 394.7 266" fill="none" stroke="#facc15" stroke-width="2.5"/>
      <text x="366" y="262" text-anchor="end" class="mono" font-size="15" fill="#facc15">172°</text>
      <!-- landmarks -->
      <g fill="#0e1628" stroke="#fff" stroke-width="2.5">
        <circle cx="392" cy="176" r="6"/>
        <circle cx="396" cy="244" r="6"/>
        <circle cx="392" cy="312" r="6"/>
        <circle cx="440" cy="262" r="6"/>
      </g>
      <g class="mono" font-size="11" fill="#8fb3c9" text-anchor="end">
        <text x="378" y="180">SHOULDER</text>
        <text x="366" y="240">ELBOW</text>
        <text x="378" y="316">WRIST</text>
      </g>
    </g>
    <g fill="#0e1628" stroke="#fff" stroke-width="2.5"><circle cx="424" cy="330" r="6"/></g>

    <!-- scan line -->
    <rect class="scan" x="24" y="24" width="500" height="60" fill="url(#scan)"/>
  </g>

  <!-- viewfinder corners -->
  <g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M44 70 V44 H70"/><path d="M478 44 H504 V70"/>
    <path d="M44 370 V396 H70"/><path d="M478 396 H504 V370"/>
  </g>
  <circle class="rec" cx="62" cy="62" r="6" fill="#ff2d55"/>
  <text x="76" y="67" class="mono" font-size="13" fill="#cbd5e1">LIVE · ON-DEVICE</text>

  <!-- ===== Feedback panel ===== -->
  <g transform="translate(548 24)">
    <rect width="328" height="392" rx="18" fill="#0e1628" stroke="#24324d"/>

    <text x="24" y="40" class="mono" font-size="12" letter-spacing="2" fill="#8fb3c9">COMPRESSION RATE</text>
    <text x="24" y="104" font-size="64" font-weight="800" fill="#fff">112</text>
    <text x="146" y="104" font-size="20" fill="#9aa0b4">/ min</text>
    <!-- rate bars -->
    <g fill="#22c55e">
      <rect class="bar" x="230" y="62" width="10" height="42" rx="3"/>
      <rect class="bar" x="246" y="54" width="10" height="50" rx="3" style="animation-delay:.15s"/>
      <rect class="bar" x="262" y="66" width="10" height="38" rx="3" style="animation-delay:.3s"/>
      <rect class="bar" x="278" y="58" width="10" height="46" rx="3" style="animation-delay:.45s"/>
    </g>
    <!-- target band -->
    <rect x="24" y="124" width="280" height="10" rx="5" fill="#1f2a40"/>
    <rect x="148" y="124" width="62" height="10" rx="5" fill="#22c55e" fill-opacity="0.35"/>
    <circle cx="186" cy="129" r="8" fill="#22c55e" stroke="#0e1628" stroke-width="3"/>
    <text x="148" y="154" class="mono" font-size="11" fill="#86efac">100 – 120 target</text>

    <line x1="24" y1="174" x2="304" y2="174" stroke="#24324d"/>

    <text x="24" y="206" class="mono" font-size="12" letter-spacing="2" fill="#8fb3c9">ELBOWS</text>
    <text x="304" y="206" text-anchor="end" font-size="16" font-weight="700" fill="#86efac">Straight ✓</text>
    <text x="24" y="242" class="mono" font-size="12" letter-spacing="2" fill="#8fb3c9">PAUSES</text>
    <text x="304" y="242" text-anchor="end" font-size="16" font-weight="700" fill="#e2e8f0">0.0 s</text>
    <text x="24" y="278" class="mono" font-size="12" letter-spacing="2" fill="#8fb3c9">TRACKING</text>
    <text x="304" y="278" text-anchor="end" font-size="16" font-weight="700" fill="#e2e8f0">Good</text>

    <!-- voice bubble -->
    <g transform="translate(24 304)">
      <rect width="280" height="64" rx="16" fill="#ff2d55" fill-opacity="0.14" stroke="#ff2d55" stroke-opacity="0.6"/>
      <!-- speaker icon -->
      <g transform="translate(20 22)" fill="#ff8fa6">
        <path d="M0 6 h6 l8 -6 v20 l-8 -6 h-6 z"/>
        <path d="M18 3 a9 9 0 0 1 0 14" fill="none" stroke="#ff8fa6" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <text x="56" y="30" font-size="17" font-weight="700" fill="#fff">“Keep going!”</text>
      <text x="56" y="50" class="mono" font-size="11" fill="#ffb3c1">spoken in your chosen language</text>
    </g>
  </g>
</svg>
