<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="CPR Coach: your AI CPR instructor, in your language, offline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.6" stop-color="#140a18"/>
      <stop offset="1" stop-color="#2a0814"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a7a"/>
      <stop offset="1" stop-color="#d4002f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffb3c1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff2d55" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      /* 0.545s per beat = 110 beats/min, the middle of the 100–120/min CPR target */
      .heart { transform-box: fill-box; transform-origin: center; animation: beat 0.545s ease-in-out infinite; }
      @keyframes beat { 0%,100% { transform: scale(1); } 25% { transform: scale(1.12); } 50% { transform: scale(0.98); } }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 1.09s ease-out infinite; }
      @keyframes ring { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(1.8); opacity: 0; } }
      .trace { stroke-dasharray: 260 1600; animation: run 2.18s linear infinite; }
      @keyframes run { from { stroke-dashoffset: 1600; } to { stroke-dashoffset: -260; } }
      .blink { animation: blink 1.09s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glow)"/>

  <!-- ECG trace -->
  <path d="M0 318 H300 l14 -8 l12 8 h22 l10 -70 l16 120 l14 -78 l10 28 h40 l18 -18 l18 18 H700 l14 -8 l12 8 h22 l10 -70 l16 120 l14 -78 l10 28 h40 l18 -18 l18 18 H1200"
        fill="none" stroke="#ff2d55" stroke-opacity="0.18" stroke-width="2"/>
  <path class="trace" d="M0 318 H300 l14 -8 l12 8 h22 l10 -70 l16 120 l14 -78 l10 28 h40 l18 -18 l18 18 H700 l14 -8 l12 8 h22 l10 -70 l16 120 l14 -78 l10 28 h40 l18 -18 l18 18 H1200"
        fill="none" stroke="#ff2d55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>

  <!-- Heart -->
  <g transform="translate(190 165)">
    <circle class="ring" r="78" fill="none" stroke="#ff2d55" stroke-width="2"/>
    <g class="heart" filter="url(#neon)">
      <path transform="scale(2.3)" d="M0 30 C-42 4 -40 -34 -16 -34 C-4 -34 0 -24 0 -19 C0 -24 4 -34 16 -34 C40 -34 42 4 0 30 Z" fill="url(#heartFill)"/>
      <!-- pulse line through the heart -->
      <path d="M-58 0 h28 l10 -22 l14 44 l12 -32 l8 10 h44" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Text -->
  <text x="330" y="96" class="mono" font-size="16" letter-spacing="4" fill="#ff8fa6">ANVATHON 2026 · OPEN INNOVATION</text>
  <text x="326" y="176" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">CPR COACH</text>
  <text x="330" y="222" font-size="26" fill="#e8e8f0">An AI CPR instructor that fits in an ordinary phone.</text>
  <text x="330" y="256" font-size="20" fill="#9aa0b4">Watches your compressions · coaches you out loud · in your language · offline</text>

  <!-- HUD chip -->
  <g transform="translate(980 64)">
    <rect width="168" height="40" rx="20" fill="#ff2d55" fill-opacity="0.12" stroke="#ff2d55" stroke-opacity="0.6"/>
    <circle class="blink" cx="22" cy="20" r="6" fill="#ff2d55"/>
    <text x="38" y="26" class="mono" font-size="16" fill="#ffd1da">110 / min</text>
  </g>
</svg>
